name: build-windows

# Costruisce EAFCMETA.exe su Windows e lo allega come ARTEFATTO del workflow.
# Non pubblica release e non usa segreti. Build NON ancora provato dall'autore.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q
      - name: Build .exe
        run: python build_windows.py
      - name: Prova di avvio (diagnosi)
        run: |
          Start-Process -FilePath .\dist\EAFCMETA.exe -ArgumentList "--diagnosi" -Wait
          Get-Content .\dist\diagnosi.txt
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: EAFCMETA-windows
          path: dist/EAFCMETA.exe
          if-no-files-found: error
